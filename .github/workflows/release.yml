name: Release Helix APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag name for the release (e.g. v1.7.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version.json
        id: ver
        run: |
          V=$(python3 -c "import json; print(json.load(open('mobile/version.json'))['version'])")
          B=$(python3 -c "import json; print(json.load(open('mobile/version.json'))['build'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "build=$B" >> "$GITHUB_OUTPUT"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$V" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project structure
        working-directory: mobile
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name helix --org com.adnanraza.helix --platforms=android
          fi
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          fi

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Stage APK
        run: |
          mkdir -p dist
          cp mobile/build/app/outputs/flutter-apk/app-release.apk dist/helix.apk
          ls -lh dist/helix.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Helix ${{ steps.ver.outputs.version }}+${{ steps.ver.outputs.build }}
          body: |
            Helix ${{ steps.ver.outputs.version }} (build ${{ steps.ver.outputs.build }})
            APK: helix.apk
            Download: https://github.com/AdnanRaza88/Helix/releases/latest/download/helix.apk
          files: dist/helix.apk
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
