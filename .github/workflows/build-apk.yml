name: Build Helix APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform + force SDK 36
        working-directory: mobile
        run: |
          set -e
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create . --project-name helix --org com.adnanraza.helix --platforms=android
          fi
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          fi
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i \
              -e 's/minSdkVersion .*/minSdkVersion 24/' \
              -e 's/minSdk = .*/minSdk = 24/' \
              -e 's/minSdk = flutter.minSdkVersion/minSdk = 24/' \
              -e 's/compileSdkVersion .*/compileSdkVersion 36/' \
              -e 's/compileSdk = .*/compileSdk = 36/' \
              -e 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' \
              -e 's/targetSdkVersion .*/targetSdkVersion 36/' \
              -e 's/targetSdk = .*/targetSdk = 36/' \
              -e 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' \
              "$f" || true
          done
          python3 -c '
          from pathlib import Path
          patch = """
          // HELIX_FORCE_COMPILE_SDK
          subprojects {
              plugins.whenPluginAdded {
                  val android = project.extensions.findByName(\"android\")
                  if (android != null) {
                      try {
                          android.javaClass.getMethod(\"setCompileSdkVersion\", Int::class.javaPrimitiveType).invoke(android, 36)
                      } catch (_: Throwable) {
                          try {
                              android.javaClass.getMethod(\"setCompileSdk\", Int::class.javaPrimitiveType).invoke(android, 36)
                          } catch (_: Throwable) {}
                      }
                  }
              }
          }
          """
          for name in ["android/build.gradle.kts", "android/build.gradle"]:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text()
              if "HELIX_FORCE_COMPILE_SDK" in text:
                  idx = text.find("// HELIX_FORCE_COMPILE_SDK")
                  text = text[:idx].rstrip()
              p.write_text(text + "\n" + patch)
              print("patched", name)
          '
          echo "=== app SDK ==="
          grep -E 'Sdk|sdk' android/app/build.gradle.kts 2>/dev/null || true
          echo "=== force marker ==="
          grep -n HELIX_FORCE_COMPILE_SDK android/build.gradle.kts 2>/dev/null || true

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK (release)
        working-directory: mobile
        run: |
          set -e
          flutter build apk --release --no-tree-shake-icons
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lah build/app/outputs/flutter-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: helix-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: List built APK
        if: always()
        run: ls -lah mobile/build/app/outputs/flutter-apk/ || true
