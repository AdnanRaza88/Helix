name: Build Helix APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project structure
        working-directory: mobile
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name helix --org com.adnanraza.helix --platforms=android
          fi

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK (release)
        working-directory: mobile
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: helix-apk
          path: |
            mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: List built APKs
        run: ls -lh mobile/build/app/outputs/flutter-apk/ || true
